<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Методи верифікації</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        .method-card { border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .method-card h3 { margin-top: 0; }
        .form-row { margin-bottom: 10px; }
        label { display: inline-block; width: 180px; font-weight: bold; vertical-align: top; }
        input, textarea, select { width: calc(100% - 200px); padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { min-height: 80px; }
        .actions { margin-top: 10px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; }
        .tag { display: inline-block; background: #e9ecef; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-right: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" id="back-link" class="back-link">← Назад до панелі</a>
        <h1>Методи верифікації</h1>
        <script>
            if (window.self !== window.top) {
                document.getElementById('back-link').style.display = 'none';
            }
        </script>

        <div class="method-card">
            <h3>Новий метод</h3>
            <div class="form-row">
                <label>Ключ (key):</label>
                <input type="text" id="new-key" placeholder="volk, diia_screens, manager_x">
            </div>
            <div class="form-row">
                <label>Назва:</label>
                <input type="text" id="new-display_name" placeholder="Волк (ПІБ / Дата / ІПН)">
            </div>
            <div class="form-row">
                <label>Поля (через кому):</label>
                <input type="text" id="new-required_client_fields" placeholder="pib,dob,ipn">
            </div>
            <div class="form-row">
                <label>Дозволені банки (через кому):</label>
                <input type="text" id="new-allowed_banks" placeholder="pumb,izibank">
            </div>
            <div class="form-row">
                <label>Кількість скріншотів:</label>
                <input type="number" id="new-required_screenshots" value="0" min="0">
            </div>
            <div class="form-row">
                <label>Інструкції для скрінів:</label>
                <textarea id="new-screenshot_instructions" placeholder="Надішліть 3 скріншоти з Дії..."></textarea>
            </div>
            <div class="form-row">
                <label>Початкове повідомлення:</label>
                <textarea id="new-initial_message" placeholder="Привітання та перше запитання"></textarea>
            </div>
            <div class="form-row">
                <label>Шаблон звіту:</label>
                <textarea id="new-report_template" placeholder="ІПН: {ipn}\nПІБ: {pib}\n..."></textarea>
            </div>
            <div class="form-row">
                <label>AI правила:</label>
                <textarea id="new-ai_rules" placeholder="Додаткові інструкції для AI"></textarea>
            </div>
            <div class="form-row">
                <label>Питати про перев'яз на старті:</label>
                <select id="new-ask_relink_at_start">
                    <option value="1">Так</option>
                    <option value="0" selected>Ні</option>
                </select>
            </div>
            <div class="form-row">
                <label>Активний:</label>
                <select id="new-is_active">
                    <option value="1">Так</option>
                    <option value="0">Ні</option>
                </select>
            </div>
            <div class="actions">
                <button class="btn-success" onclick="createMethod()">Створити</button>
            </div>
        </div>

        <h2>Існуючі методи</h2>
        <div id="methods-list"></div>
    </div>

    <script>
        async function loadMethods() {
            const resp = await fetch('/api/methods');
            const data = await resp.json();
            const list = document.getElementById('methods-list');
            list.innerHTML = '';

            for (const [key, method] of Object.entries(data.methods)) {
                const card = document.createElement('div');
                card.className = 'method-card';
                const fields = (method.required_client_fields || []).map(f => `<span class="tag">${f}</span>`).join('');
                card.innerHTML = `
                    <h3>${method.display_name} <small>(${key})</small></h3>
                    <div class="form-row">
                        <label>Ключ:</label>
                        <input type="text" value="${key}" disabled>
                    </div>
                    <div class="form-row">
                        <label>Назва:</label>
                        <input type="text" id="display_name-${key}" value="${method.display_name || ''}">
                    </div>
                    <div class="form-row">
                        <label>Поля:</label>
                        <input type="text" id="required_client_fields-${key}" value="${(method.required_client_fields || []).join(',')}">
                    </div>
                    <div class="form-row">
                        <label>Дозволені банки:</label>
                        <input type="text" id="allowed_banks-${key}" value="${(method.allowed_banks || []).join(',')}">
                    </div>
                    <div class="form-row">
                        <label>Скріншотів:</label>
                        <input type="number" id="required_screenshots-${key}" value="${method.required_screenshots || 0}">
                    </div>
                    <div class="form-row">
                        <label>Інструкції скрінів:</label>
                        <textarea id="screenshot_instructions-${key}">${method.screenshot_instructions || ''}</textarea>
                    </div>
                    <div class="form-row">
                        <label>Початкове повідомлення:</label>
                        <textarea id="initial_message-${key}">${method.initial_message || ''}</textarea>
                    </div>
                    <div class="form-row">
                        <label>Шаблон звіту:</label>
                        <textarea id="report_template-${key}">${method.report_template || ''}</textarea>
                    </div>
                    <div class="form-row">
                        <label>AI правила:</label>
                        <textarea id="ai_rules-${key}">${method.ai_rules || ''}</textarea>
                    </div>
                    <div class="form-row">
                        <label>Питати про перев'яз на старті:</label>
                        <select id="ask_relink_at_start-${key}">
                            <option value="1" ${method.ask_relink_at_start == 1 ? 'selected' : ''}>Так</option>
                            <option value="0" ${method.ask_relink_at_start == 0 ? 'selected' : ''}>Ні</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Активний:</label>
                        <select id="is_active-${key}">
                            <option value="1" ${method.is_active == 1 ? 'selected' : ''}>Так</option>
                            <option value="0" ${method.is_active == 0 ? 'selected' : ''}>Ні</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Поля:</label>
                        <div>${fields || 'немає'}</div>
                    </div>
                    <div class="actions">
                        <button class="btn-primary" onclick="updateMethod('${key}')">Зберегти</button>
                        <button class="btn-danger" onclick="deleteMethod('${key}')">Видалити</button>
                    </div>
                `;
                list.appendChild(card);
            }
        }

        function getMethodData(prefix = 'new') {
            const key = prefix === 'new' ? document.getElementById('new-key').value.trim() : prefix;
            return {
                display_name: document.getElementById(`${prefix === 'new' ? 'new' : 'display_name'}-${prefix}`).value,
                required_client_fields: document.getElementById(`${prefix === 'new' ? 'new-required_client_fields' : 'required_client_fields-' + prefix}`).value.split(',').map(s => s.trim()).filter(Boolean),
                allowed_banks: document.getElementById(`${prefix === 'new' ? 'new-allowed_banks' : 'allowed_banks-' + prefix}`).value.split(',').map(s => s.trim()).filter(Boolean),
                required_screenshots: parseInt(document.getElementById(`${prefix === 'new' ? 'new-required_screenshots' : 'required_screenshots-' + prefix}`).value) || 0,
                screenshot_instructions: document.getElementById(`${prefix === 'new' ? 'new-screenshot_instructions' : 'screenshot_instructions-' + prefix}`).value,
                initial_message: document.getElementById(`${prefix === 'new' ? 'new-initial_message' : 'initial_message-' + prefix}`).value,
                report_template: document.getElementById(`${prefix === 'new' ? 'new-report_template' : 'report_template-' + prefix}`).value,
                ai_rules: document.getElementById(`${prefix === 'new' ? 'new-ai_rules' : 'ai_rules-' + prefix}`).value,
                ask_relink_at_start: parseInt(document.getElementById(`${prefix === 'new' ? 'new-ask_relink_at_start' : 'ask_relink_at_start-' + prefix}`).value) || 0,
                is_active: parseInt(document.getElementById(`${prefix === 'new' ? 'new-is_active' : 'is_active-' + prefix}`).value)
            };
        }

        async function createMethod() {
            const key = document.getElementById('new-key').value.trim();
            if (!key) return alert('Введіть ключ методу');
            const body = getMethodData('new');
            body.key = key;
            const resp = await fetch('/api/methods', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (resp.ok) {
                loadMethods();
                document.querySelectorAll('#new-key, #new-display_name, #new-required_client_fields, #new-allowed_banks, #new-screenshot_instructions, #new-initial_message, #new-report_template, #new-ai_rules').forEach(el => el.value = '');
                document.getElementById('new-required_screenshots').value = 0;
            } else {
                alert('Помилка створення методу');
            }
        }

        async function updateMethod(key) {
            const body = getMethodData(key);
            const resp = await fetch(`/api/methods/${key}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (resp.ok) {
                loadMethods();
            } else {
                alert('Помилка оновлення методу');
            }
        }

        async function deleteMethod(key) {
            if (!confirm('Видалити метод?')) return;
            const resp = await fetch(`/api/methods/${key}`, {method: 'DELETE'});
            if (resp.ok) {
                loadMethods();
            } else {
                alert('Помилка видалення методу');
            }
        }

        loadMethods();
    </script>
</body>
</html>
